# Rideable-window thresholds and the v0 station list.
# Shore bearings are measured once (OpenStreetMap) and are not re-fetched.

[limits]
surface_points = 8
aerodromes = 8
marine_points = 4
ensemble_points = 2

[kite]
speed_min_kt = 15
speed_max_kt = 30
excluded_shore = ["offshore"]
daylight_required = true

[kite.sea_breeze]
direction_min_deg = 200
direction_max_deg = 250
speed_above_inland_kt = 5
inland_point = "perth-airport"
timezone = "Australia/Perth"
check_wmo = [94602, 94614, 95605]
airport_wmo = 94151

[[surface]]
id = "cottesloe"
latitude = -31.9953964
longitude = 115.7511955
onshore_from_deg = 270
osm_way = 29283079
marine = true

[[surface]]
id = "safety-bay"
latitude = -32.3040595
longitude = 115.7286309
onshore_from_deg = 235
osm_way = 559982738
marine = true

[[surface]]
